version: 2

models:
  - name: gold_metrics_daily
    description: "Daily aggregate per device+parameter+measurement (event_day = date_trunc('day', ts)). avg/min/max/count of value."
    columns:
      - name: sample_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - measurement
              - cdevice
              - pdevice
              - parameter
              - event_day

  - name: gold_metrics_hourly
    description: "Hourly aggregate per device+parameter+measurement (ts_hour = date_trunc('hour', ts)). avg/min/max/count of value."
    columns:
      - name: sample_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - measurement
              - cdevice
              - pdevice
              - parameter
              - ts_hour
