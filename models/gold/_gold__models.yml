version: 2

models:
  - name: gold_metrics_daily
    description: "Daily aggregate per device+parameter+measurement. avg/min/max/count of value."
    columns:
      - name: sample_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - measurement
              - cdevice
              - pdevice
              - parameter
              - dt

  - name: gold_metrics_daily_aa010
    description: "Example measurement-scoped gold mart: only measurement='AA010', derived from gold_metrics_daily."
    columns:
      - name: sample_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - measurement
              - cdevice
              - pdevice
              - parameter
              - dt
