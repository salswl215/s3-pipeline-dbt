version: 2

models:
  - name: silver_metrics_aa010
    description: "Example measurement-scoped silver mart: only measurement='AA010', derived from silver_metrics."
    columns:
      - name: value
        tests: [not_null]
      - name: ts
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - measurement
              - cdevice
              - pdevice
              - parameter
              - ts_ns

  - name: gold_metrics_daily_aa010
    description: "Example measurement-scoped gold mart: only measurement='AA010', derived from gold_metrics_daily."
    columns:
      - name: sample_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - measurement
              - cdevice
              - pdevice
              - parameter
              - dt
