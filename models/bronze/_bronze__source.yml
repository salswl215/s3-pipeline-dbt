version: 2

sources:
  - name: bronze
    description: "Raw->bronze Iceberg metrics produced by ../s3-pipeline. Read-only contract."
    schema: bronze
    tables:
      - name: metrics
        description: "Append-only event metrics, Iceberg hidden-partitioned by day(ts)."
        loaded_at_field: ts
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 72, period: hour}
        columns:
          - name: cdevice
            description: "tag (device)"
          - name: pdevice
            description: "tag (device)"
          - name: parameter
            description: "tag (metric name)"
          - name: value
            description: "field value (double)"
          - name: ts
            description: "event time, microsecond, UTC (timestamptz, created via PyIceberg). day(ts) hidden partition derives from this."
          - name: ts_ns
            description: "original ns epoch (lossless, bigint)"
          - name: measurement
            description: "line-protocol measurement"
